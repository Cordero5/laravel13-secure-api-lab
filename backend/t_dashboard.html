<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Boarding House System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background-color: #212529; }
        .sidebar .nav-link { color: rgba(255, 255, 255, .75); font-weight: 500; padding: 12px 20px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #343a40; }
        .sidebar .nav-link i { margin-right: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse px-0">
            <div class="p-3 text-white border-bottom border-secondary">
                <h5 class="mb-0">Boarding House Admin</h5>
            </div>
<ul class="nav flex-column mt-3">
    <li class="nav-item">
        <a class="nav-link active" href="http://127.0.0.1:8000/admin/dashboard">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link " href="http://127.0.0.1:8000/admin/rooms">
            <i class="bi bi-door-closed"></i> Rooms
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link " href="http://127.0.0.1:8000/admin/tenants">
            <i class="bi bi-people"></i> Tenants
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link " href="http://127.0.0.1:8000/admin/payments">
            <i class="bi bi-credit-card"></i> Payments
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link " href="http://127.0.0.1:8000/admin/checkins">
            <i class="bi bi-box-arrow-in-right"></i> Check-In / Check-Out
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link " href="http://127.0.0.1:8000/admin/rules">
            <i class="bi bi-journal-text"></i> House Rules
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link " href="http://127.0.0.1:8000/admin/announcements">
            <i class="bi bi-megaphone"></i> Announcements
        </a>
    </li>
</ul>
        </nav>

        <!-- Main Content Area -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                <h1 class="h2">Admin Dashboard</h1>
            </div>

            <!-- Metric Cards -->
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Total Rooms</h6>
                            <h3 class="fw-bold text-primary mb-0">2</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Registered Tenants</h6>
                            <h3 class="fw-bold text-success mb-0">2</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="card-title text-muted">Total Payments</h6>
                            <h3 class="fw-bold text-warning mb-0">₱0.00</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h6 class="card-title text-muted">House Rules</h6>
                            <h3 class="fw-bold text-info mb-0">0</h3>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
